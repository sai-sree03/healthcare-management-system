spring.application.name=HMS
server.port=${PORT:8080}

# ---- Database (override with environment variables; never hard-code real credentials) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# ---- Session / cookies ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Error responses: never leak internals ----
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Actuator: expose only the health endpoint ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- HMS settings ----
hms.appointment.slot-minutes=30
hms.seed.enabled=${HMS_SEED_ENABLED:true}
hms.seed.demo-data=${HMS_SEED_DEMO:true}
hms.seed.admin-password=${HMS_ADMIN_PASSWORD:Admin@123}
hms.seed.receptionist-password=${HMS_RECEPTIONIST_PASSWORD:Reception@123}
hms.seed.doctor-password=${HMS_DOCTOR_PASSWORD:Doctor@123}

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing & payments | HMS</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="logo">HMS <span style="font-size:.72rem;font-weight:500;color:#71858d">CARE WORKSPACE</span></div><nav id="mainNav" aria-label="Main navigation"></nav><div class="user-box" id="userBox"></div></header><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><main class="container"><div class="page-heading"><div><h1 class="page-title">Billing & payments</h1><p class="page-subtitle">Create invoices and record full or partial payments.</p></div><a class="btn secondary" href="dashboard.html">Back to dashboard</a></div><div class="card"><h2>Create invoice</h2><form id="billForm" class="form-grid"><div class="form-group"><label for="patient">Patient name *</label><input id="patient" required maxlength="100"></div><div class="form-group"><label for="description">Charge description *</label><input id="description" required maxlength="160" placeholder="Consultation fee"></div><div class="form-group"><label for="amount">Amount (₹) *</label><input id="amount" type="number" min="0.01" max="10000000" step="0.01" required></div><div class="form-group"><label for="discount">Discount (₹)</label><input id="discount" type="number" min="0" max="10000000" step="0.01" value="0"></div><div class="form-group"><label for="payment">Payment received (₹)</label><input id="payment" type="number" min="0" max="10000000" step="0.01" value="0"></div><div class="form-actions full"><button class="btn" type="submit">Create invoice</button></div></form></div><div class="card"><h2>Invoices</h2><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Patient</th><th>Description</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status / action</th></tr></thead><tbody id="billBody"></tbody></table></div></div></main><script src="js/common.js"></script><script src="js/workflow.js"></script><script>HMS.init('billing').then(function(){if(window.HMSWorkflow) HMSWorkflow.start('billing');});</script></body></html>

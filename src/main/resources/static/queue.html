<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visit queue | HMS</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="logo">HMS <span style="font-size:.72rem;font-weight:500;color:#71858d">CARE WORKSPACE</span></div><nav id="mainNav" aria-label="Main navigation"></nav><div class="user-box" id="userBox"></div></header><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><main class="container"><div class="page-heading"><div><h1 class="page-title">Visit queue</h1><p class="page-subtitle">Check-in and track outpatient visits.</p></div><a class="btn secondary" href="dashboard.html">Back to dashboard</a></div><div class="card"><h2>Check in a patient</h2><form id="visitForm" class="form-grid"><div class="form-group"><label for="patient">Patient name *</label><input id="patient" required maxlength="100" placeholder="Full name"></div><div class="form-group"><label for="visitReason">Reason for visit</label><input id="visitReason" maxlength="180" placeholder="e.g. Follow-up"></div><div class="form-group"><label for="doctor">Doctor</label><input id="doctor" maxlength="100" placeholder="Doctor name"></div><div class="form-group"><label for="visitDate">Visit date</label><input id="visitDate" type="date" required></div><div class="form-actions full"><button class="btn" type="submit">Check in & issue token</button></div></form></div><div class="card"><h2>Today's queue</h2><div class="table-wrap"><table><thead><tr><th>Token</th><th>Patient</th><th>Reason</th><th>Doctor</th><th>Status</th><th>Actions</th></tr></thead><tbody id="queueBody"></tbody></table></div></div></main><script src="js/common.js"></script><script src="js/workflow.js"></script><script>HMS.init('queue').then(function(){if(window.HMSWorkflow) HMSWorkflow.start('queue');});</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - HMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">HMS</div>
        <nav id="mainNav" aria-label="Main navigation"></nav>
        <div class="user-box" id="userBox"></div>
    </header>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main class="container">
        <h1 class="page-title">Patients</h1>
        <p class="page-subtitle">Register and manage patient details.</p>

        <section class="card hidden" id="formCard">
            <h2 id="formTitle">Add patient</h2>
            <form id="patientForm" novalidate>
                <input type="hidden" id="patientId">
                <div class="form-grid">
                    <div class="form-group"><label for="fullName">Full name *</label><input type="text" id="fullName" name="fullName" maxlength="100" required></div>
                    <div class="form-group"><label for="dateOfBirth">Date of birth *</label><input type="date" id="dateOfBirth" name="dateOfBirth" required></div>
                    <div class="form-group"><label for="gender">Gender *</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select...</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                    <div class="form-group"><label for="phone">Phone *</label><input type="tel" id="phone" name="phone" maxlength="18" required></div>
                    <div class="form-group"><label for="email">Email *</label><input type="email" id="email" name="email" maxlength="120" required></div>
                    <div class="form-group"><label for="bloodGroup">Blood group</label>
                        <select id="bloodGroup" name="bloodGroup">
                            <option value="">Unknown</option>
                            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                        </select>
                    </div>
                    <div class="form-group full"><label for="address">Address</label><input type="text" id="address" name="address" maxlength="255"></div>
                    <div class="form-group"><label for="emergencyContactName">Emergency contact name</label><input type="text" id="emergencyContactName" name="emergencyContactName" maxlength="100"></div>
                    <div class="form-group"><label for="emergencyContactPhone">Emergency contact phone</label><input type="tel" id="emergencyContactPhone" name="emergencyContactPhone" maxlength="18"></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" id="saveBtn">Save patient</button>
                    <button type="button" class="btn secondary" id="cancelBtn">Clear</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="toolbar">
                <div class="grow form-group"><label for="searchBox">Search</label><input type="search" id="searchBox" placeholder="Name, phone or email"></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Email</th><th>Blood</th><th>Emergency contact</th><th id="actionsHead">Actions</th></tr></thead>
                    <tbody id="patientBody"><tr><td colspan="8" class="empty">Loading...</td></tr></tbody>
                </table>
            </div>
            <div class="pager" id="pager"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/patients.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prescriptions | HMS</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="logo">HMS <span style="font-size:.72rem;font-weight:500;color:#71858d">CARE WORKSPACE</span></div><nav id="mainNav" aria-label="Main navigation"></nav><div class="user-box" id="userBox"></div></header><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><main class="container"><div class="page-heading"><div><h1 class="page-title">Prescriptions</h1><p class="page-subtitle">Build a readable medicine list and print it for review.</p></div><a class="btn secondary" href="dashboard.html">Back to dashboard</a></div><div class="card"><h2>New prescription</h2><form id="rxForm" class="form-grid"><div class="form-group"><label for="patient">Patient name *</label><input id="patient" required maxlength="100"></div><div class="form-group"><label for="prescriber">Prescriber</label><input id="prescriber" maxlength="100"></div><div class="form-group"><label for="medicine">Medicine name *</label><input id="medicine" required maxlength="120"></div><div class="form-group"><label for="strength">Strength</label><input id="strength" maxlength="60" placeholder="As prescribed"></div><div class="form-group"><label for="dose">Dose *</label><input id="dose" required maxlength="100" placeholder="e.g. 1 tablet"></div><div class="form-group"><label for="frequency">Frequency *</label><input id="frequency" required maxlength="100" placeholder="e.g. twice daily"></div><div class="form-group"><label for="duration">Duration</label><input id="duration" maxlength="100" placeholder="e.g. 5 days"></div><div class="form-group"><label for="instructions">Instructions</label><input id="instructions" maxlength="250" placeholder="e.g. after food"></div><div class="form-actions full"><button class="btn" type="submit">Add medicine</button><button class="btn

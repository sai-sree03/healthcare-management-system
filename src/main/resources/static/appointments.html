<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - HMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">HMS</div>
        <nav id="mainNav" aria-label="Main navigation"></nav>
        <div class="user-box" id="userBox"></div>
    </header>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main class="container">
        <h1 class="page-title">Appointments</h1>
        <p class="page-subtitle" id="subtitle">Book and manage visits.</p>

        <section class="card hidden" id="formCard">
            <h2 id="formTitle">Book appointment</h2>
            <form id="appointmentForm" novalidate>
                <input type="hidden" id="appointmentId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="patientLookup">Patient * (type a name, then pick from the list)</label>
                        <input type="text" id="patientLookup" list="patientOptions" autocomplete="off" placeholder="Start typing...">
                        <datalist id="patientOptions"></datalist>
                        <span class="field-error" data-error-for="patientId"></span>
                    </div>
                    <div class="form-group"><label for="doctorId">Doctor *</label><select id="doctorId" name="doctorId" required><option value="">Select...</option></select></div>
                    <div class="form-group"><label for="appointmentDate">Date *</label><input type="date" id="appointmentDate" name="appointmentDate" required></div>
                    <div class="form-group"><label for="startTime">Time *</label><input type="time" id="startTime" name="startTime" step="900" required></div>
                    <div class="form-group full"><label for="reason">Reason *</label><input type="text" id="reason" name="reason" maxlength="255" required></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" id="saveBtn">Save appointment</button>
                    <button type="button" class="btn secondary" id="cancelBtn">Clear</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="toolbar">
                <div class="form-group" id="doctorFilterWrap"><label for="filterDoctor">Doctor</label><select id="filterDoctor"><option value="">All doctors</option></select></div>
                <div class="form-group"><label for="filterDate">Date</label><input type="date" id="filterDate"></div>
                <div class="form-group"><label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="">All</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
                <button type="button" class="btn secondary" id="clearFilters">Reset filters</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="appointmentBody"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
                </table>
            </div>
            <div class="pager" id="pager"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/appointments.js"></script>
</body>
</html>

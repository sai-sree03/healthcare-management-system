<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - HMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">HMS</div>
        <nav id="mainNav" aria-label="Main navigation"></nav>
        <div class="user-box" id="userBox"></div>
    </header>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main class="container">
        <h1 class="page-title">Medical records</h1>
        <p class="page-subtitle" id="subtitle">Diagnoses, treatments and prescriptions.</p>

        <section class="card hidden" id="formCard">
            <h2 id="formTitle">Add medical record</h2>
            <form id="recordForm" novalidate>
                <input type="hidden" id="recordId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="patientLookup">Patient * (type a name, then pick from the list)</label>
                        <input type="text" id="patientLookup" list="patientOptions" autocomplete="off" placeholder="Start typing...">
                        <datalist id="patientOptions"></datalist>
                        <span class="field-error" data-error-for="patientId"></span>
                    </div>
                    <div class="form-group"><label for="recordDate">Record date *</label><input type="date" id="recordDate" name="recordDate" required></div>
                    <div class="form-group full"><label for="diagnosis">Diagnosis *</label><input type="text" id="diagnosis" name="diagnosis" maxlength="255" required></div>
                    <div class="form-group full"><label for="treatment">Treatment *</label><textarea id="treatment" name="treatment" maxlength="2000" required></textarea></div>
                    <div class="form-group full"><label for="prescription">Prescription</label><textarea id="prescription" name="prescription" maxlength="2000"></textarea></div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" id="saveBtn">Save record</button>
                    <button type="button" class="btn secondary" id="cancelBtn">Clear</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="toolbar">
                <div class="grow form-group"><label for="searchBox">Search</label><input type="search" id="searchBox" placeholder="Patient name or diagnosis"></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Date</th><th>Patient</th><th>Doctor</th><th>Diagnosis</th><th>Treatment</th><th>Prescription</th><th>Actions</th></tr></thead>
                    <tbody id="recordBody"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
                </table>
            </div>
            <div class="pager" id="pager"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/medical-records.js"></script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultation | HMS</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="logo">HMS <span style="font-size:.72rem;font-weight:500;color:#71858d">CARE WORKSPACE</span></div><nav id="mainNav" aria-label="Main navigation"></nav><div class="user-box" id="userBox"></div></header><div id="toast" class="toast hidden" role="status" aria-live="polite"></div><main class="container"><div class="page-heading"><div><h1 class="page-title">Consultation</h1><p class="page-subtitle">Document the visit, observations and clinical plan.</p></div><a class="btn secondary" href="dashboard.html">Back to dashboard</a></div><div class="card"><h2>Consultation notes</h2><form id="consultForm" class="form-grid"><div class="form-group"><label for="patient">Patient name *</label><input id="patient" required maxlength="100"></div><div class="form-group"><label for="visitDate">Visit date *</label><input id="visitDate" type="date" required></div><div class="form-group"><label for="bp">Blood pressure</label><input id="bp" maxlength="20" placeholder="e.g. 120/80 mmHg"></div><div class="form-group"><label for="temperature">Temperature (°C)</label><input id="temperature" type="number" step="0.1" min="25" max="45"></div><div class="form-group"><label for="pulse">Pulse (bpm)</label><input id="pulse" type="number" min="20" max="250"></div><div class="form-group"><label for="weight">Weight (kg)</label><input id="weight" type="number" min="0" max="500" step="0.1"></div><div class="form-group full"><label for="allergies">Known allergies</label><input id="allergies" maxlength="500" placeholder="Record known allergies or 'Not reported'"></div><div class="form-group full"><label for="complaints">Chief complaints *</label><textarea id="complaints" required maxlength="2000"></textarea></div><div class="form-group full"><label for="findings">Examination / findings</label><textarea id="findings" maxlength="3000"></textarea></div><div class="form-group full"><label for="diagnosis">Assessment / diagnosis</label><textarea id="diagnosis" maxlength="2000"></textarea></div><div class="form-group"><label for="followup">Follow-up date</label><input id="followup" type="date"></div><div class="form-actions full"><button class="btn" type="submit">Save consultation draft</button><button class="btn secondary" type="button" id="completeVisit">Complete consultation</button></div></form></div><div class="card"><h2>Saved consultations</h2><div class="table-wrap"><table><thead><tr><th>Patient</th><th>Date</th><th>Complaints</th><th>Assessment</th><th>Status</th></tr></thead><tbody id="consultBody"></tbody></table></div></div></main><script src="js/common.js"></script><script src="js/workflow.js"></script><script>HMS.init('consultation').then(function(){if(window.HMSWorkflow) HMSWorkflow.start('consultation');});</script></body></html>
